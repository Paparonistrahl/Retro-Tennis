function drawPac(){
 const p=center(pac.x,pac.y),now=Date.now(),powered=now<power;
 ctx.save();ctx.translate(p.x,p.y);
 // Keep Paparoni upright in every direction; mirror the side profile when moving left.
 if(pac.dir==='left')ctx.scale(-1,1);
 const bob=Math.sin(now/90)*1.1,breath=1+Math.sin(now/125)*.025;
 ctx.translate(0,bob);ctx.scale(breath,breath);
 if(powered){ctx.shadowColor='#72c8ff';ctx.shadowBlur=13;ctx.strokeStyle='#92d9ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(0,0,14,15,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}
 if(paparoniSprite.complete&&paparoniSprite.naturalWidth){
   ctx.shadowColor=powered?'#68caff':'#ff304a';ctx.shadowBlur=powered?10:7;
   ctx.drawImage(paparoniSprite,-12,-13,24,26);
 }else{
   ctx.fillStyle='#ed1d2f';ctx.strokeStyle='#ffdf4d';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,1,9,12,-.35,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#54e743';ctx.fillRect(1,-13,7,4);
 }
 ctx.restore();
}
function drawGhost(g){if(g.eatenUntil&&Date.now()<g.eatenUntil)return;let p=center(g.x,g.y),now=Date.now(),fright=now<power,blink=fright&&(power-now)<=2000&&Math.floor(now/150)%2===0,blue=fright&&!blink;ctx.save();ctx.translate(p.x,p.y);if(Math.abs(dirs[g.dir]?.[0]||0)>0)ctx.rotate((dirs[g.dir][0]>0?1:-1)*.08);let leg='#173f2d',green=blue?'#3478ff':'#16834b',head=blue?'#6aa3ff':'#27b96a',wing=blue?'#244fc5':'#a95c28',wingHi=blue?'#5b8bff':'#d58a43';ctx.strokeStyle=leg;ctx.lineWidth=1.7;ctx.lineCap='round';for(let side of [-1,1])for(let yy of [-4,0,4]){ctx.beginPath();ctx.moveTo(side*5,yy);ctx.lineTo(side*9,yy-2);ctx.lineTo(side*10,yy+2);ctx.stroke()}ctx.beginPath();ctx.moveTo(-3,-7);ctx.quadraticCurveTo(-8,-13,-6,-14);ctx.moveTo(3,-7);ctx.quadraticCurveTo(8,-13,6,-14);ctx.stroke();ctx.fillStyle=wing;ctx.beginPath();ctx.ellipse(0,2,7.2,9.2,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=wingHi;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,10);ctx.stroke();ctx.fillStyle=green;ctx.beginPath();ctx.ellipse(0,-5,5.2,4.2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=head;ctx.beginPath();ctx.arc(0,-9,3.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10251b';ctx.beginPath();ctx.arc(-1.5,-9,1,0,Math.PI*2);ctx.arc(1.5,-9,1,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,420,460);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let v=map[y][x],px=x*T,py=y*T;if(v==='#'){ctx.fillStyle=wallColors[0];ctx.fillRect(px+1,py+1,18,18);ctx.strokeStyle=wallColors[1];ctx.lineWidth=1.5;ctx.strokeRect(px+2,py+2,16,16);ctx.fillStyle=wallColors[2];ctx.fillRect(px+5,py+5,10,10)}else if(v==='.'||v==='o'){ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(px+10,py+10,v==='o'?(Math.sin(Date.now()/100)*1.2+4):1.7,0,7);ctx.fill()}else if(v==='p'){let pulse=3+Math.sin(Date.now()/130)*1.5;ctx.strokeStyle='#4df6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px+10,py+10,6+pulse*.35,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#9afaff';ctx.fillRect(px+8,py+8,4,4)}else if(v==='d'){let open=gateOpen();ctx.fillStyle=open?'#164b55':'#a94b20';ctx.fillRect(px+2,py+2,16,16);ctx.strokeStyle=open?'#55f5ff':'#ffb34d';ctx.lineWidth=2;ctx.strokeRect(px+3,py+3,14,14);if(!open){ctx.fillStyle='#ffd58a';ctx.fillRect(px+5,py+5,10,3);ctx.fillRect(px+5,py+12,10,3)}}else if(v==='c'){ctx.save();ctx.translate(px+10,py+10);ctx.rotate(-.55);ctx.fillStyle='#ed2638';ctx.beginPath();ctx.moveTo(-2,-7);ctx.bezierCurveTo(5,-9,8,-2,5,5);ctx.bezierCurveTo(3,10,-1,11,-3,6);ctx.bezierCurveTo(-6,1,-7,-5,-2,-7);ctx.fill();ctx.strokeStyle='#ff8290';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-2,-5);ctx.quadraticCurveTo(2,-1,2,5);ctx.stroke();ctx.strokeStyle='#75e07a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-7);ctx.quadraticCurveTo(-1,-10,2,-10);ctx.stroke();ctx.restore()}}if(portalPair.length===2)for(const [x,y] of portalPair){let px=x*T+10,py=y*T+10,pulse=3+Math.sin(Date.now()/130)*1.5;ctx.strokeStyle='#4df6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py,6+pulse*.35,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#9afaff';ctx.fillRect(px-2,py-2,4,4)}if(gateCell){let [x,y]=gateCell,open=gateOpen();ctx.fillStyle=open?'#164b55':'#a94b20';ctx.fillRect(x*T+2,y*T+2,16,16);ctx.strokeStyle=open?'#55f5ff':'#ffb34d';ctx.lineWidth=2;ctx.strokeRect(x*T+3,y*T+3,1 function loop(t){if(!running)return;if(Date.now()<stunUntil){accum=0;last=t;draw();raf=requestAnimationFrame(loop);return}let elapsed=last?Math.min(t-last,40):0;last=t;accum+=elapsed;while(accum>=160&&running){accum-=160;if(Date.now()>=cherryNextAt&&!map.some(row=>row.includes('c'))){spawnCherry();scheduleCherry()}let from=movePac();if(!collide(from)&&tick++%2===0){for(const g of ghosts){moveGhost(g);if(collide(from))break}}}draw();if(running)raf=requestAnimationFrame(loop)}

const dpad=$('dpad'),activeTouches=new Map();
function directionAtPoint(x,y){let best=null,bestDist=Infinity;dpad.querySelectorAll('button[data-dir]').forEach(b=>{const r=b.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),dist=dx*dx+dy*dy;if(dist<bestDist){bestDist=dist;best=b.dataset.dir}});return bestDist<=82*82?best:null}

const releasePad=e=>activeTouches.delete(e.pointerId);
dpad.addEventListener('pointerup',releasePad);dpad.addEventListener('pointercancel',releasePad);dpad.addEventListener('lostpointercapture',releasePad);

addEventListener('keydown',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]){e.preventDefault();direction(m[e.key])}if(e.key===' '){e.preventDefault();pause()}});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>18)direction(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
fresh();draw();$('overlay').classList.add('home-screen');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
