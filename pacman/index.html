<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080b20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Paparoni Pac-Man"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Paparoni Pac-Man Classic</title>
<style>
:root{color-scheme:dark;--bg:#080b20;--blue:#172b85;--wall:#244dff;--yellow:#ffe34d;--mint:#8affd0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;background:radial-gradient(ellipse at 50% 15%,#18245a,var(--bg) 68%);color:#fff;font-family:system-ui,Arial}body{height:100dvh;width:100vw}canvas,button,.joystick{touch-action:none}.app{height:100dvh;width:min(100%,620px);margin:auto;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);display:flex;flex-direction:column;gap:7px}.top{display:flex;justify-content:space-between;align-items:center;font:800 12px monospace;letter-spacing:2px;color:#a9bcff}.brand{color:var(--yellow)}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score{background:#111a43;border:1px solid #334cae;border-radius:9px;text-align:center;padding:5px}.score small{display:block;color:#9eb2ff;font:10px monospace}.score b{font:900 21px monospace;color:#fff}.board-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{height:100%;width:auto;max-width:100%;aspect-ratio:21/23;max-height:100%;background:#050817;border:2px solid #385dff;border-radius:9px;box-shadow:0 0 22px #214dff66;display:block;touch-action:none}.overlay{position:absolute;inset:0;background:#050817eF;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;z-index:4}.overlay h1{margin:0;color:var(--yellow);font-size:clamp(25px,7vw,42px);letter-spacing:2px;text-shadow:0 0 18px #ffdf4380}.overlay p{margin:0;color:#c4d0ff;font:12px/1.5 monospace;max-width:280px}.btn{border:2px solid var(--yellow);background:linear-gradient(#fff17c,#ffbd22);color:#18204a;border-radius:10px;padding:12px 25px;font-weight:1000;font-size:16px;box-shadow:0 0 18px #ffdb4d55}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}.status{font:11px monospace;color:var(--mint);min-height:16px}.sound{border:1px solid #4055a4;background:#111a43;color:#dce5ff;border-radius:8px;padding:7px 11px;font-size:16px}.dpad{position:relative;width:154px;height:154px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;justify-content:center;align-content:center;align-self:center;justify-self:center;padding:5px;border:2px solid #4968df;border-radius:50%;background:radial-gradient(circle,#1b2d78 0%,#0d1747 72%);box-shadow:inset 0 0 18px #5274ff55,0 0 18px #244dff55;touch-action:none;isolation:isolate}.dpad::after{content:"";position:absolute;inset:-50%;border-radius:50%;z-index:0;touch-action:none}.dpad button{position:relative;z-index:1}.dpad button{min-width:0;min-height:0;width:46px;height:46px;border:1px solid #6b83ff;background:linear-gradient(145deg,#263d9b,#111d54);color:#fff;border-radius:50%;font-size:23px;font-weight:950;box-shadow:0 3px 0 #080f36,0 0 10px #244dff44;touch-action:none}.dpad button:active{background:linear-gradient(145deg,#fff17c,#ffbd22);color:#18204a;transform:translateY(2px);box-shadow:0 1px 0 #080f36}.dpad button.selected{background:linear-gradient(145deg,#fff17c,#ffbd22);color:#18204a;border-color:#fff4a8;box-shadow:0 0 0 2px #ffdf4d66,0 0 16px #ffdf4dcc,0 3px 0 #9b6c0d}.dpad button{border:1px solid #4a67df;background:#14245d;color:#fff;border-radius:9px;font-size:22px;font-weight:900;touch-action:none}.dpad [data-dir=up]{grid-column:2;grid-row:1}.dpad [data-dir=down]{grid-column:2;grid-row:3}.dpad [data-dir=left]{grid-column:1;grid-row:2;align-self:center}.dpad [data-dir=right]{grid-column:3;grid-row:2;align-self:center}.foot{text-align:center;color:#6073b5;font:9px monospace;letter-spacing:1px}
@media (max-height:560px) and (orientation:landscape){.app{width:100%;padding:3px 8px;display:grid;grid-template-columns:minmax(120px,1fr) minmax(0, min(75vh,calc(100vw - 300px))) minmax(120px,1fr);grid-template-rows:auto auto 1fr auto;gap:4px}.top{grid-column:1/4}.scores{grid-column:1;grid-row:2;display:flex;flex-direction:column}.score{padding:3px}.score b{font-size:17px}.board-wrap{grid-column:2;grid-row:1/5}.board{height:min(96dvh,100%);width:auto}.bottom{grid-column:3;grid-row:2;align-self:start;flex-direction:column}.dpad{display:grid;grid-column:3;grid-row:3;width:132px;height:132px;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(3,38px);gap:3px;padding:4px;align-self:center;justify-self:center;justify-content:center;align-content:center}.dpad button{width:38px;height:38px;min-width:0;min-height:0;font-size:20px}.foot{grid-column:1/4;grid-row:4}.overlay{border-radius:8px}}
@media (orientation:portrait) and (max-height:700px){.app{gap:4px;padding-left:8px;padding-right:8px}.score b{font-size:18px}.foot{font-size:8px}}
</style></head><body><main class="app">
<div class="top"><span class="brand">◈ PAPARONI ARCADE</span><span>PAC-MAN CLASSIC</span></div>
<section class="scores"><div class="score"><small>PUNKTE</small><b id="score">0</b></div><div class="score"><small>HIGH SCORE</small><b id="high">0</b></div><div class="score"><small>LEBEN</small><b id="lives">3</b></div></section>
<div class="board-wrap"><canvas class="board" id="game" width="420" height="460" aria-label="Pac-Man Spielfeld"></canvas><div class="overlay" id="overlay"><h1 id="headline">PAC-MAN</h1><p id="intro">Friss alle Punkte und hüte dich vor den Geistern!<br>Power-Pillen machen die Geister kurz verwundbar.</p><button class="btn" id="start">▶ START</button></div></div>
<div class="bottom"><span class="status" id="status">BEREIT ZUM SPIEL</span><button class="sound" id="sound" aria-label="Ton ausschalten">🔊</button></div><div class="dpad" id="dpad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<div class="foot">COPYRIGT BY PAPARONI · INSERT COIN TO PLAY</div></main>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),T=20,C=21,R=23;
// iOS Safari: prevent rubber-band scrolling and browser gestures while playing.
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('gestureend',e=>e.preventDefault(),{passive:false});
const raw=[
"#####################",
"#.........#.........#",
"#.###.###.#.###.###.#",
"#o#...#...#...#...#o#",
"#.###.#.#####.#.###.#",
"#.....#...#...#.....#",
"#####.###.#.###.#####",
"    #.#.......#.#    ",
"#####.#.## ##.#.#####",
"...... ..# #.. ......",
"#####.#.#####.#.#####",
"    #.#.......#.#    ",
"#####.#.#####.#.#####",
"#.........#.........#",
"#.###.###.#.###.###.#",
"#o..#.....P.....#..o#",
"###.#.#.#####.#.#.###",
"#...#.#...#...#.#...#",
"#.###.###.#.###.###.#",
"#......... ... .....#",
"#.###.###.###.###.###",
"#...................#",
"#####################"];
// Normalize the central ghost-house corridor while keeping a connected maze.
let map=raw.map(r=>(r+' '.repeat(C)).slice(0,C).split(''));
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},opposite={up:'down',down:'up',left:'right',right:'left'};
let pac={x:10,y:15,dir:'left',want:'left',step:0},ghosts=[],score=0,lives=3,high=+(localStorage.getItem('paparoni-pac-high')||0),power=0,running=false,paused=false,last=0,raf=0,muted=false,audioCtx=null,remaining=0;
$('high').textContent=high;
function wall(x,y){return y<0||y>=R||x<0||x>=C||map[y][x]==='#'}
function center(x,y){return{x:x*T+T/2,y:y*T+T/2}}
function resetActors(){pac={x:10,y:15,dir:'left',want:'left',step:0};ghosts=[{x:9,y:11,color:'#ff5577',dir:'left',home:0},{x:10,y:11,color:'#45e8ff',dir:'right',home:1},{x:11,y:11,color:'#ff9cf4',dir:'left',home:2},{x:10,y:12,color:'#ffad45',dir:'up',home:3}]}
function countDots(){remaining=map.flat().filter(v=>v==='.'||v==='o').length}
function fresh(){map=raw.map(r=>(r+' '.repeat(C)).slice(0,C).split(''));map[15][10]=' ';resetActors();countDots();score=0;lives=3;power=0;updateUI()}
function updateUI(){$('score').textContent=score;$('lives').textContent=lives;$('high').textContent=high}
function chirp(freq=500,dur=.07){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function direction(d){if(!dirs[d])return;pac.want=d;$('dpad').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.dir===d))}
function movePac(){if(!wall(pac.x+dirs[pac.want][0],pac.y+dirs[pac.want][1]))pac.dir=pac.want;let [dx,dy]=dirs[pac.dir];if(!wall(pac.x+dx,pac.y+dy)){pac.x+=dx;pac.y+=dy;pac.step++}let v=map[pac.y][pac.x];if(v==='.'||v==='o'){map[pac.y][pac.x]=' ';score+=v==='o'?50:10;if(v==='o')power=Date.now()+7000;remaining--;chirp(v==='o'?880:620,.045);if(score>high){high=score;localStorage.setItem('paparoni-pac-high',high)}updateUI();if(!remaining){running=false;show('GEWONNEN!','Das Labyrinth ist leer. Starke Runde!', '↻ NOCHMAL')}}}
function ghostOptions(g){return Object.keys(dirs).filter(d=>d!==opposite[g.dir]&&!wall(g.x+dirs[d][0],g.y+dirs[d][1]))}
function moveGhost(g){let opts=ghostOptions(g);if(!opts.length)opts=[opposite[g.dir]];let frightened=Date.now()<power;let target=opts.map(d=>{let x=g.x+dirs[d][0],y=g.y+dirs[d][1],dist=Math.abs(x-pac.x)+Math.abs(y-pac.y);return{d,dist}});target.sort((a,b)=>frightened?b.dist-a.dist:a.dist-b.dist);let choice=target[0];if(Math.random()<.24)choice=target[Math.floor(Math.random()*target.length)];g.dir=choice.d;g.x+=dirs[g.dir][0];g.y+=dirs[g.dir][1];}
function collide(){for(let g of ghosts){if(g.x===pac.x&&g.y===pac.y){if(Date.now()<power){score+=200;g.x=10;g.y=11;g.dir='up';chirp(260,.18);updateUI()}else{lives--;updateUI();chirp(110,.3);if(lives<=0){running=false;show('GAME OVER','Die Geister waren diesmal schneller.','↻ NOCHMAL')}else{resetActors()}return}}}}
function show(title,txt,button){$('headline').textContent=title;$('intro').innerHTML=txt;$('start').textContent=button;$('overlay').style.display='flex'}
function start(){if(running)return;if(lives<=0||remaining===0)fresh();$('overlay').style.display='none';running=true;paused=false;last=0;raf=requestAnimationFrame(loop);chirp(740,.1)}
function drawPac(){let p=center(pac.x,pac.y),mouth=.2+Math.abs(Math.sin(Date.now()/90))*.22,angle={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[pac.dir];
ctx.save();
ctx.fillStyle='#b0008e';ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();
ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.arc(p.x,p.y,8,angle-mouth,angle+mouth);ctx.closePath();ctx.fill();
ctx.globalCompositeOperation='source-over';
ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,7.5,0,Math.PI*2);ctx.clip();
ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(p.x-4,p.y-3);ctx.lineTo(p.x+2,p.y-3);ctx.moveTo(p.x-4,p.y);ctx.lineTo(p.x+4,p.y);ctx.moveTo(p.x-4,p.y+3);ctx.lineTo(p.x+2,p.y+3);ctx.stroke();
ctx.restore();ctx.restore()}
function drawGhost(g){let p=center(g.x,g.y),fright=Date.now()<power;ctx.fillStyle=fright?'#315dff':g.color;ctx.beginPath();ctx.arc(p.x,p.y-1,8,Math.PI,0);ctx.lineTo(p.x+8,p.y+8);ctx.lineTo(p.x+4,p.y+5);ctx.lineTo(p.x,p.y+8);ctx.lineTo(p.x-4,p.y+5);ctx.lineTo(p.x-8,p.y+8);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-1,3,0,7);ctx.arc(p.x+3,p.y-1,3,0,7);ctx.fill();ctx.fillStyle='#172b85';ctx.beginPath();ctx.arc(p.x-2,p.y,1.5,0,7);ctx.arc(p.x+4,p.y,1.5,0,7);ctx.fill()}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,420,460);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let v=map[y][x],px=x*T,py=y*T;if(v==='#'){ctx.fillStyle='#142c9a';ctx.fillRect(px+1,py+1,18,18);ctx.strokeStyle='#4770ff';ctx.lineWidth=1.5;ctx.strokeRect(px+2,py+2,16,16);ctx.fillStyle='#1e3ac0';ctx.fillRect(px+5,py+5,10,10)}else if(v==='.'||v==='o'){ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(px+10,py+10,v==='o'?(Math.sin(Date.now()/100)*1.2+4):1.7,0,7);ctx.fill()}}drawPac();ghosts.forEach(drawGhost);if(Date.now()<power){ctx.fillStyle='#9bc5ff';ctx.font='10px monospace';ctx.fillText('POWER!',8,14)}}
function loop(t){if(!running)return;let elapsed=t-last;if(!last||elapsed>100)elapsed=0;last=t;if(elapsed>115)elapsed=115;accum+=elapsed;if(accum>140){accum=0;movePac();if(tick++%2===0)ghosts.forEach(moveGhost);collide()}draw();if(running)raf=requestAnimationFrame(loop)}
let accum=0,tick=0;
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);show('PAUSE','Kurze Verschnaufpause?','▶ WEITER')}
$('start').addEventListener('click',()=>{if($('headline').textContent==='PAUSE'){ $('overlay').style.display='none';running=true;last=0;raf=requestAnimationFrame(loop);return}start()});
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};
const heldDirections=new Map(),dpad=$('dpad');
function syncHeldDirection(){let latest=[...heldDirections.values()].at(-1);if(latest)direction(latest)}
function directionAtPoint(x,y){
  const r=dpad.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
  if(Math.max(Math.abs(dx),Math.abs(dy))<8)return null;
  return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');
}
dpad.addEventListener('pointerdown',e=>{
  e.preventDefault();dpad.setPointerCapture?.(e.pointerId);
  const dir=directionAtPoint(e.clientX,e.clientY);
  if(dir){heldDirections.delete(e.pointerId);heldDirections.set(e.pointerId,dir);direction(dir)}
});
dpad.addEventListener('pointermove',e=>{
  if(!heldDirections.has(e.pointerId))return;
  const dir=directionAtPoint(e.clientX,e.clientY);
  if(dir&&dir!==heldDirections.get(e.pointerId)){
    heldDirections.delete(e.pointerId);heldDirections.set(e.pointerId,dir);direction(dir);
  }
});
const releaseDirection=e=>{if(heldDirections.delete(e.pointerId))syncHeldDirection()};
dpad.addEventListener('pointerup',releaseDirection);
dpad.addEventListener('pointercancel',releaseDirection);
dpad.addEventListener('lostpointercapture',releaseDirection);

addEventListener('keydown',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]){e.preventDefault();direction(m[e.key])}if(e.key===' '){e.preventDefault();pause()}});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>18)direction(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
fresh();draw();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script></body></html>
