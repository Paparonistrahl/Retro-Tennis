lt();saveRank()}});function show(title,txt,button){$('rankPanel').style.display='none';$('headline').textContent=title;$('intro').innerHTML=txt;$('start').textContent=button;$('overlay').style.display='flex'}
async function start(){if(running)return;$('rankPanel').style.display='none';pendingRank=false;sessionToken='';try{const sr=await fetch(SUPABASE_URL+'/functions/v1/pacman-score',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({action:'start'})});const sd=await sr.json().catch(()=>({}));if(sr.ok)sessionToken=sd.token||'';else console.warn('Secure score session unavailable',sd.error)}catch(e){console.warn('Secure score session unavailable',e)}if(nextLevel){level++;map=makeLevel(level);resetActors();countDots();power=0;nextLevel=false;updateUI()}else if(lives<=0||remaining===0)fresh();$('overlay').style.display='none';running=true;paused=false;last=0;raf=requestAnimationFrame(loop);chirp(740,.1);startMusic()}
function drawPac(){let p=center(pac.x,pac.y),mouth=.18+Math.abs(Math.sin(Date.now()/75))*.34,angle={right:0,left:Math.PI,up:-Math.PI/2,down:Math.PI/2}[pac.dir];ctx.fillStyle='#ffe34d';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.arc(p.x,p.y,8,angle+mouth,angle+Math.PI*2-mouth);ctx.closePath();ctx.fill()}
function drawGhost(g){if(g.eatenUntil&&Date.now()<g.eatenUntil)return;let p=center(g.x,g.y),fright=Date.now()<power;ctx.fillStyle=fright?'#315dff':g.color;ctx.beginPath();ctx.arc(p.x,p.y-1,8,Math.PI,0);ctx.lineTo(p.x+8,p.y+8);ctx.lineTo(p.x+4,p.y+5);ctx.lineTo(p.x,p.y+8);ctx.lineTo(p.x-4,p.y+5);ctx.lineTo(p.x-8,p.y+8);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-3,p.y-1,3,0,7);ctx.arc(p.x+3,p.y-1,3,0,7);ctx.fill();ctx.fillStyle='#172b85';ctx.beginPath();ctx.arc(p.x-2,p.y,1.5,0,7);ctx.arc(p.x+4,p.y,1.5,0,7);ctx.fill()}
function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,420,460);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let v=map[y][x],px=x*T,py=y*T;if(v==='#'){ctx.fillStyle=wallColors[0];ctx.fillRect(px+1,py+1,18,18);ctx.strokeStyle=wallColors[1];ctx.lineWidth=1.5;ctx.strokeRect(px+2,py+2,16,16);ctx.fillStyle=wallColors[2];ctx.fillRect(px+5,py+5,10,10)}else if(v==='.'||v==='o'){ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(px+10,py+10,v==='o'?(Math.sin(Date.now()/100)*1.2+4):1.7,0,7);ctx.fill()}else if(v==='c'){ctx.fillStyle='#f22';ctx.beginPath();ctx.arc(px+7,py+12,5,0,7);ctx.arc(px+13,py+12,5,0,7);ctx.fill();ctx.strokeStyle='#72ed75';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+10,py+8);ctx.lineTo(px+12,py+3);ctx.stroke()}}drawPac();ghosts.forEach(drawGhost);if(ghostPopup&&Date.now()<ghostPopup.until){let p=center(ghostPopup.x,ghostPopup.y);ctx.fillStyle='#ffe34d';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('+'+ghostPopup.points,p.x,p.y-12);ctx.textAlign='left'}if(Date.now()<power){ctx.fillStyle='#9bc5ff';ctx.font='10px monospace';ctx.fillText('POWER!',8,14)}}
function loop(t){if(!running)return;if(Date.now()<stunUntil){accum=0;last=t;draw();raf=requestAnimationFrame(loop);return}let elapsed=last?Math.min(t-last,40):0;last=t;accum+=elapsed;while(accum>=160&&running){accum-=160;if(Date.now()>=cherryNextAt&&!map.some(row=>row.includes('c'))){spawnCherry();scheduleCherry()}let from=movePac();if(!collide(from)&&tick++%2===0){for(const g of ghosts){moveGhost(g);if(collide(from))break}}}draw();if(running)raf=requestAnimationFrame(loop)}
let accum=0,tick=0;
function pause(){if(!running)return;running=false;stopMusic();cancelAnimationFrame(raf);show('PAUSE','Kurze Verschnaufpause?','▶ WEITER')}
$('start').addEventListener('click',async()=>{if($('headline').textContent==='PAUSE'){ $('overlay').style.display='none';running=true;last=0;raf=requestAnimationFrame(loop);startMusic();return}await start()});
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';if(muted)stopMusic();else if(running)startMusic()};
const dpad=$('dpad'),activeTouches=new Map();
function directionAtPoint(x,y){const r=dpad.getBoundingClientRect(),dx=x-r.left-r.width/2,dy=y-r.top-r.height/2;if(Math.max(Math.abs(dx),Math.abs(dy))<10)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();dpad.setPointerCapture?.(e.pointerId);const dir=directionAtPoint(e.clientX,e.clientY);if(dir){activeTouches.set(e.pointerId,dir);direction(dir)}});
dpad.addEventListener('pointermove',e=>{if(!activeTouches.has(e.pointerId))return;const dir=directionAtPoint(e.clientX,e.clientY);if(dir&&dir!==activeTouches.get(e.pointerId)){activeTouches.set(e.pointerId,dir);direction(dir)}});
const releasePad=e=>activeTouches.delete(e.pointerId);
dpad.addEventListener('pointerup',releasePad);dpad.addEventListener('pointercancel',releasePad);dpad.addEventListener('lostpointercapture',releasePad);

addEventListener('keydown',e=>{let m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(m[e.key]){e.preventDefault();direction(m[e.key])}if(e.key===' '){e.preventDefault();pause()}});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>18)direction(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause()});
fresh();draw();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
