function draw(){ctx.fillStyle='#050817';ctx.fillRect(0,0,420,460);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let v=map[y][x],px=x*T,py=y*T;if(v==='#'){ctx.fillStyle=wallColors[0];ctx.fillRect(px+1,py+1,18,18);ctx.strokeStyle=wallColors[1];ctx.lineWidth=1.5;ctx.strokeRect(px+2,py+2,16,16);ctx.fillStyle=wallColors[2];ctx.fillRect(px+5,py+5,10,10)}else if(v==='.'||v==='o'){ctx.fillStyle='#fff1bd';ctx.beginPath();ctx.arc(px+10,py+10,v==='o'?(Math.sin(Date.now()/100)*1.2+4):1.7,0,7);ctx.fill()}else if(v==='p'){let pulse=3+Math.sin(Date.now()/130)*1.5;ctx.strokeStyle='#4df6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px+10,py+10,6+pulse*.35,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#9afaff';ctx.fillRect(px+8,py+8,4,4)}else if(v==='d'){let open=gateOpen();ctx.fillStyle=open?'#164b55':'#a94b20';ctx.fillRect(px+2,py+2,16,16);ctx.strokeStyle=open?'#55f5ff':'#ffb34d';ctx.lineWidth=2;ctx.strokeRect(px+3,py+3,14,14);if(!open){ctx.fillStyle='#ffd58a';ctx.fillRect(px+5,py+5,10,3);ctx.fillRect(px+5,py+12,10,3)}}else if(v==='a'||v==='b'||v==='s'){let color=v==='a'?'#ffb24b':v==='b'?'#fff34d':'#67f7ff',glyph=v==='a'?'▧':v==='b'?'✹':'ϟ',pulse=1+Math.sin(Date.now()/95)*.12;ctx.save();ctx.translate(px+10,py+10);ctx.scale(pulse,pulse);ctx.shadowColor=color;ctx.shadowBlur=12;ctx.fillStyle='rgba(5,8,23,.9)';ctx.beginPath();ctx.roundRect(-8,-8,16,16,4);ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=color;ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(glyph,0,1);ctx.restore()}else if(v==='c'){ctx.save();ctx.translate(px+10,py+10);ctx.rotate(-.55);ctx.fillStyle='#ed2638';ctx.beginPath();ctx.moveTo(-2,-7);ctx.bezierCurveTo(5,-9,8,-2,5,5);ctx.bezierCurveTo(3,10,-1,11,-3,6);ctx.bezierCurveTo(-6,1,-7,-5,-2,-7);ctx.fill();ctx.strokeStyle='#ff8290';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-2,-5);ctx.quadraticCurveTo(2,-1,2,5);ctx.stroke();ctx.strokeStyle='#75e07a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-2,-7);ctx.quadraticCurveTo(-1,-10,2,-10);ctx.stroke();ctx.restore()}}if(portalPair.length===2)for(const [x,y] of portalPair){let px=x*T+10,py=y*T+10,pulse=3+Math.sin(Date.now()/130)*1.5;ctx.strokeStyle='#4df6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(px,py,6+pulse*.35,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#9afaff';ctx.fillRect(px-2,py-2,4,4)}if(gateCell){let [x,y]=gateCell,open=gateOpen();ctx.fillStyle=open?'#164b55':'#a94b20';ctx.fillRect(x*T+2,y*T+2,16,16);ctx.strokeStyle=open?'#55f5ff':'#ffb34d';ctx.lineWidth=2;ctx.strokeRect(x*T+3,y*T+3,14,14);if(!open){ctx.fillStyle='#ffd58a';ctx.fillRect(x*T+5,y*T+5,10,3);ctx.fillRect(x*T+5,y*T+12,10,3)}}drawShockwave();drawPac();ghosts.forEach(drawGhost);if(ghostPopup&&Date.now()<ghostPopup.until){let p=center(ghostPopup.x,ghostPopup.y);ctx.fillStyle='#ffe34d';ctx.font='bold 13px monospace';ctx.textAlign='center';ctx.fillText('+'+ghostPopup.points,p.x,p.y-12);ctx.textAlign='left'}if(Date.now()<power){ctx.fillStyle='#9bc5ff';ctx.font='10px monospace';ctx.fillText('POWER!',8,14)}}
function loop(t){if(!running)return;ejectPacFromWall();if(Date.now()<stunUntil){accum=0;last=t;draw();raf=requestAnimationFrame(loop);return}let elapsed=last?Math.min(t-last,40):0;last=t;accum+=elapsed;while(accum>=(Date.now()<speedPowerUntil?90:160)&&running){accum-=Date.now()<speedPowerUntil?90:160;if(Date.now()>=cherryNextAt&&!map.some(row=>row.includes('c'))){spawnCherry();scheduleCherry()}if(Date.now()>=powerupNextAt&&!map.some(row=>row.some(v=>v==='a'||v==='b'||v==='s'))){spawnFieldPowerup();schedulePowerup()}let from=movePac();if(!collide(from)&&tick++%2===0){for(const g of ghosts){moveGhost(g);if(collide(from))break}}}renderPowerups();draw();if(running)raf=requestAnimationFrame(loop)}

let homeRanksOpen=false;$('highscoreBtn').addEventListener('click',async e=>{e.preventDefault();e.stopPropagation();if(running)return;const panel=$('rankPanel');homeRanksOpen=!homeRanksOpen;panel.style.display=homeRanksOpen?'block':'none';$('highscoreBtn').textContent=homeRanksOpen?'✕ HIGHSCORE SCHLIESSEN':'🏆 HIGHSCORE';if(!homeRanksOpen)return;$('rankPrompt').textContent='🏆 ONLINE TOP TEN';$('rankEntry').style.display='none';$('rankList').textContent='LÄDT …';await renderRanks();if(!homeRanksOpen)panel.style.display='none'});$('start').addEventListener('click',()=>{if($('headline').textContent==='PAUSE'){ $('overlay').style.display='none';$('controls').style.display='flex';$('dpad').style.display='grid';running=true;last=0;raf=requestAnimationFrame(loop);startMusic();return}start()});

const dpad=$('dpad'),activeTouches=new Map();
function directionAtPoint(x,y){let best=null,bestDist=Infinity;dpad.querySelectorAll('button[data-dir]').forEach(b=>{const r=b.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),dist=dx*dx+dy*dy;if(dist<bestDist){bestDist=dist;best=b.dataset.dir}});return bestDist<=82*82?best:null}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();dpad.setPointerCapture?.(e.pointerId);const dir=directionAtPoint(e.clientX,e.clientY);if(dir){activeTouches.set(e.pointerId,dir);direction(dir)}});
